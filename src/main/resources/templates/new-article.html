<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Makale ekle</title><link rel="stylesheet" href="/css/style.css">
</head>
<body><main class="form-page">
    <a href="/">← Bloga dön</a><h1>Yeni makale</h1>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form method="post" th:action="@{/makale/yeni}">
        <label>Başlık<input name="title" maxlength="200" required></label>
        <label>Makale<textarea name="content" rows="12" required></textarea></label>
        <button type="submit">Yayımla</button>
    </form>
</main></body>
</html>
